<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>認時間小幫手</title>
<style>
  :root{
    --bg:#fdf1ec;
    --ink:#6b5150;
    --pink:#f39ab6;
    --pink-soft:#ffd9e4;
    --mint:#a6d9ac;
    --mint-soft:#d8efd8;
    --yellow:#fbe7a2;
    --yellow-deep:#ffd97a;
    --lav:#c9b6e4;
    --red:#e2453f;
    --blue:#7ec2e6;

    /* 時鐘疊在圖上的位置（若指針沒對準鐘面，微調這三個值即可） */
    --cx:52.9%;
    --cy:47.7%;
    --size:46%;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Segoe UI",sans-serif;
    background:radial-gradient(circle at 50% 0,#fff7f3,var(--bg) 70%);color:var(--ink);min-height:100vh;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;padding:16px 14px 40px;}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;}
  h1{font-size:24px;font-weight:900;margin:0 0 2px;letter-spacing:1px;color:#e77aa0;text-shadow:1px 2px 0 #fff;}
  .sub{font-size:13px;color:#b58aa0;margin-bottom:12px;text-align:center;}

  .topbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;}
  .difflabel{font-size:12px;font-weight:900;color:#b58aa0;align-self:center;}
  /* ===== 糖果玻璃按鈕（依參考圖） ===== */
  .tag,.lvl,.key,.rnd,.spk{position:relative;border:none;cursor:pointer;user-select:none;-webkit-user-select:none;
    box-shadow:0 6px 13px -5px rgba(230,140,170,.5),0 0 0 3px rgba(255,255,255,.6),
      inset 0 2px 2px rgba(255,255,255,.92),inset 0 -6px 10px rgba(120,80,90,.22);
    transition:transform .06s,filter .1s;}
  .tag::before,.lvl::before,.key::before,.rnd::before,.spk::before{content:"";position:absolute;
    top:2px;left:9%;right:9%;height:40%;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.05));}
  .tag:active,.lvl:active,.key:active,.rnd:active,.spk:active{transform:translateY(2px);filter:brightness(.97);}

  .tag{border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:800;color:#b85a80;
       background:linear-gradient(180deg,#ffe6ef,#ff9ec4 60%,#f472a6);}
  .tag.on{color:#8a5a12;background:linear-gradient(180deg,#fff2c6,#ffd777 60%,#f4b93f);}

  /* 圖 + 疊上去的時鐘 */
  .stage{position:relative;width:100%;max-width:440px;}
  .stage>img{width:100%;display:block;border-radius:18px;}
  .clockwrap{position:absolute;left:var(--cx);top:var(--cy);width:var(--size);transform:translate(-50%,-50%);}
  svg#clock{width:100%;display:block;overflow:visible;}
  svg#clock.grab{cursor:grab;}
  .spk{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;font-size:19px;z-index:3;
       background:linear-gradient(180deg,#ffe6ef,#ff9ec4 60%,#f472a6);}

  /* 讀時卡片 */
  .card{width:100%;max-width:400px;background:#fff;border:2.5px solid var(--pink-soft);border-radius:22px;
        margin-top:14px;padding:13px 14px;position:relative;min-height:66px;text-align:center;
        display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -8px rgba(220,150,175,.5);}
  .card .txt{font-weight:800;line-height:1.2;color:var(--ink);}
  .big{font-size:25px;} .huge{font-size:27px;} .small{font-size:13px;color:#b58aa0;font-weight:700;}
  .hh{color:#e2453f;} .mm{color:#3f9bd0;}
  .stat{position:absolute;top:7px;right:12px;font-size:12px;font-weight:900;color:var(--pink);}

  .steppers{display:flex;justify-content:center;gap:18px;margin-top:12px;}
  .stp{display:flex;align-items:center;gap:6px;}
  .stp .lab{font-size:13px;font-weight:900;} .stp .lab.h{color:var(--red);} .stp .lab.m{color:#3f9bd0;}
  .rnd{width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:900;line-height:1;color:#fff;
       box-shadow:0 4px 9px -4px rgba(120,110,130,.5),0 0 0 2.5px rgba(255,255,255,.7),
         inset 0 2px 2px rgba(255,255,255,.92),inset 0 -5px 9px rgba(0,0,0,.14);}
  .rnd.h{background:linear-gradient(180deg,#ffd6d2,#f79690 58%,#ea5a52);}
  .rnd.m{background:linear-gradient(180deg,#dcf0fb,#8fd0f2 58%,#46a6de);}

  .btnrow{display:flex;gap:10px;justify-content:center;margin-top:14px;width:100%;max-width:400px;}
  .key{flex:1;min-width:0;border-radius:20px;padding:13px 6px;font-size:15px;font-weight:900;color:#6b4a52;
       display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;}
  .key .k-sub{font-size:11px;font-weight:700;opacity:.9;}
  .key.y{background:linear-gradient(180deg,#fff3c8,#ffd777 58%,#f5bb45);}
  .key.b{background:linear-gradient(180deg,#ddf1fd,#8fd0f2 58%,#4aa9e0);color:#1c5f88;}
  .key.r{background:linear-gradient(180deg,#ffe0ea,#ff9ec2 58%,#f472a4);}
  .key.g{background:linear-gradient(180deg,#e2f6df,#a6de9f 58%,#6cc267);color:#3d7a38;}
  .key .num{font-size:22px;}

  .levels{width:100%;max-width:400px;margin-top:18px;}
  .levels .lt{font-size:13px;font-weight:900;color:#b58aa0;text-align:center;margin-bottom:8px;}
  .lvlrow{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
  .lvl{border-radius:18px;padding:12px 8px;font-size:14px;font-weight:900;color:#b85a80;
       display:flex;align-items:center;justify-content:center;gap:5px;
       background:linear-gradient(180deg,#ffe9f0,#ffb2d0 60%,#f785b0);}
  .lvl.on{color:#8a5a12;background:linear-gradient(180deg,#fff2c6,#ffd777 60%,#f4b93f);}
  .lvl.wide{grid-column:1/-1;color:#1c5f88;background:linear-gradient(180deg,#e3f2fd,#9fd3f4 60%,#5cb3e6);}
  .lvl.wide.on{color:#8a5a12;background:linear-gradient(180deg,#fff2c6,#ffd777 60%,#f4b93f);}
  .lvl .badge{position:absolute;top:-9px;right:-6px;font-size:17px;z-index:2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}

  .tip{font-size:12px;color:#b58aa0;margin-top:18px;line-height:1.7;text-align:center;max-width:400px;}
  .tip b.h{color:var(--red);} .tip b.m{color:#3f9bd0;}

  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
  .celebrate{animation:pop .5s ease;}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .shake{animation:shk .35s ease;}
  .burst{position:absolute;font-size:26px;pointer-events:none;animation:fly 1s ease-out forwards;z-index:6;}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  @media (max-width:360px){h1{font-size:22px;} .big{font-size:22px;} .huge{font-size:24px;}}
</style>
</head>

    <button class="spk" id="spkBtn" title="聲音開關">🔊</button>
    <div class="clockwrap">
      <svg id="clock" class="grab" viewBox="0 0 100 100" aria-label="時鐘">
        <defs>
          <filter id="hsh" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="0.5" stdDeviation="0.5" flood-color="#b23b30" flood-opacity="0.35"/>
          </filter>
        </defs>
        <g id="ticks" stroke="#d98aa6"></g>
        <g id="numbers" font-weight="800" fill="#6b5150" font-family="inherit" font-size="8.6"></g>
        <g filter="url(#hsh)">
          <line id="minHand" x1="50" y1="50" x2="50" y2="17" stroke="#2f8fd0" stroke-width="2.4" stroke-linecap="round"/>
          <g id="hourHand">
            <line x1="50" y1="50" x2="50" y2="30" stroke="#e2453f" stroke-width="3.4" stroke-linecap="round"/>
            <line x1="50" y1="31" x2="50" y2="26" stroke="#8a2420" stroke-width="3.4" stroke-linecap="round"/>
          </g>
          <circle cx="50" cy="50" r="2.8" fill="#e2453f"/>
          <circle cx="50" cy="50" r="1.1" fill="#fff"/>
        </g>
      </svg>

  <div class="card" id="lcd"><span class="stat" id="stat"></span><span class="txt" id="lcdtxt"></span></div>

    <div class="stp"><span class="lab m">分</span>

    <div class="lt">選關卡</div>

      <button class="lvl on" data-mode="free">自由玩</button>
      <button class="lvl" data-mode="quiz">一般練習</button>
      <button class="lvl" data-mode="streak">連對5題</button>
      <button class="lvl" data-mode="timed">30秒衝刺</button>

    </div>

  <p class="tip">
    先只看 <b class="h">紅色短針</b>，過了哪個數字就是幾點多；<br>
    再用 <b class="m">藍色長針</b> 從 12 開始「5、10、15…」數格子。
  </p>

<script>
(function(){
  var cx=50, cy=50, hours=3, minutes=0;
  var mode='free', diff='hour', streak=0, correct=null, options=[];
  var timedScore=0, timeLeft=30, timer=null, running=false, solved=false, medal=false, target=null;
  var $=function(id){return document.getElementById(id);};
  var svg=$('clock'), hourHand=$('hourHand'), minHand=$('minHand');
  var lcdtxt=$('lcdtxt'), statEl=$('stat'), toy=$('stage');

  /* 鐘面：淡淡刻度 + 數字（畫在留白鐘面上） */
  (function(){
    var tk=$('ticks');
    for(var i=0;i<60;i++){var a=i*6*Math.PI/180, long=(i%5===0), r1=44, r2=long?40:42;
      var l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',cx+r1*Math.sin(a));l.setAttribute('y1',cy-r1*Math.cos(a));
      l.setAttribute('x2',cx+r2*Math.sin(a));l.setAttribute('y2',cy-r2*Math.cos(a));
      l.setAttribute('stroke-width',long?1:0.5);l.setAttribute('stroke-linecap','round');
      l.setAttribute('stroke-opacity',long?0.6:0.32);tk.appendChild(l);}
    var g=$('numbers');
    for(var n=1;n<=12;n++){var an=n*30*Math.PI/180, R=33;
      var t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',cx+R*Math.sin(an));t.setAttribute('y',cy-R*Math.cos(an)+3);
      t.setAttribute('text-anchor','middle');t.textContent=n;g.appendChild(t);}
  })();

  function h12(h){return (h%12===0)?12:h%12;}
  function fmt(h,m){return h12(h)+':'+String(m).padStart(2,'0');}

  /* ===== 語音（中英文，維持現行設定） ===== */
  var canSpeak=('speechSynthesis' in window), muted=false, voices=[], spkTimer=null;
  function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
  if(canSpeak){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
  function bestVoice(pref){
    if(!voices.length)loadVoices();
    var list=voices.filter(function(v){return ((v.lang||'').toLowerCase().replace('_','-')).indexOf(pref)===0;});
    if(!list.length)return null;
    var prefer=['google us english','samantha','allison','ava','microsoft','english (united states)'];
    for(var i=0;i<prefer.length;i++)for(var j=0;j<list.length;j++)
      if(((list[j].name||'')+' '+(list[j].lang||'')).toLowerCase().indexOf(prefer[i])>=0)return list[j];
    for(var k=0;k<list.length;k++)if(list[k].default)return list[k];
    return list[0];
  }
  function pickEn(){return bestVoice('en-us')||bestVoice('en');}
  function pickZh(){for(var i=0;i<voices.length;i++){var l=(voices[i].lang||'').toLowerCase();if(l.indexOf('zh')===0||l.indexOf('cmn')===0)return voices[i];}return null;}
  var ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  var TENS=['','','twenty','thirty','forty','fifty'];
  function enNum(n){if(n<20)return ONES[n];return TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'');}
  function enTime(h,m){var H=h12(h),N=h12(h+1);
    if(m===0)return H+" o'clock";
    if(m===15)return 'quarter past '+H;
    if(m===30)return 'half past '+H;
    if(m===45)return 'quarter to '+N;
    if(m<10)return H+' oh '+enNum(m);
    return H+' '+enNum(m);}
  function zhTime(h,m){var H=h12(h);
    if(m===0)return H+'點整';
    if(m===30)return H+'點半';
    return H+'點'+m+'分';}
  function speak(h,m){
    if(!canSpeak||muted)return;
    try{
      if(!voices.length)loadVoices();
      speechSynthesis.cancel();try{speechSynthesis.resume();}catch(e){}
      var ve=pickEn(), vz=pickZh();
      var zh=new SpeechSynthesisUtterance(zhTime(h,m));zh.lang=(vz&&vz.lang)||'zh-TW';zh.rate=.95;zh.pitch=1.15;if(vz)zh.voice=vz;
      var en=new SpeechSynthesisUtterance(enTime(h,m));en.lang=(ve&&ve.lang)||'en-US';en.rate=.92;en.pitch=1.0;if(ve)en.voice=ve;
      zh.onend=function(){ if(ve){try{speechSynthesis.speak(en);}catch(e){}} };
      speechSynthesis.speak(zh);
    }catch(e){}
  }
  function speakNow(){speak(hours,minutes);}
  function speakTarget(){if(target)speak(target.h,target.m);}
  function speakSoon(){if(!canSpeak||muted)return;clearTimeout(spkTimer);spkTimer=setTimeout(speakNow,420);}

  function renderClock(){
    minHand.setAttribute('transform','rotate('+(minutes*6)+' '+cx+' '+cy+')');
    hourHand.setAttribute('transform','rotate('+((hours%12+minutes/60)*30)+' '+cx+' '+cy+')');
  }
  function lcd(html){lcdtxt.innerHTML=html;}
  function setStat(t){statEl.textContent=t||'';}

  function freeLCD(){
    var h=h12(hours), out='<span class="big"><span class="hh">'+h+'點</span>';
    if(minutes===0)out+='<span class="hh">整</span>';
    else if(minutes===30)out+='<span class="mm"> 半</span>';
    else out+='<span class="mm"> '+minutes+'分</span>';
    out+='</span><br><span class="small">'+fmt(hours,minutes)+' ・ '+enTime(hours,minutes)+'</span>';lcd(out);
  }
  function update(){renderClock();if(mode==='free')freeLCD();else if(mode==='listen')listenLCD();}

  function mkKey(row,cls,top,sub,fn,isNum){
    var b=document.createElement('button');b.className='key '+cls;
    b.innerHTML=(isNum?top:'<span style="font-size:20px">'+top+'</span>')+(sub?'<span class="k-sub">'+sub+'</span>':'');
    b.onclick=fn;row.appendChild(b);
  }
  function answerButtons(){
    var row=$('btnrow');row.innerHTML='';var colors=['y','b','r'];
    options.forEach(function(o,i){mkKey(row,colors[i%3],'<span class="num">'+fmt(o.h,o.m)+'</span>','',function(){answer(o);},true);});
  }
  function freeButtons(){
    var row=$('btnrow');row.innerHTML='';
    if(canSpeak)mkKey(row,'y','唸時間',speakNow);
    mkKey(row,'b','隨機時間',function(){randomFree();});
    mkKey(row,'r','歸零',function(){hours=0;minutes=0;update();});
  }

  function clearTimer(){if(timer){clearInterval(timer);timer=null;}}
  function setLevel(m){[].forEach.call($('levels').children,function(b){b.classList.toggle('on',b.dataset.mode===m);});}
  function enterMode(m){
    clearTimer();running=false;solved=false;mode=m;setLevel(m);
    if(m==='free'){svg.classList.add('grab');$('steppers').style.display='flex';setStat('');freeButtons();update();return;}
    if(m==='listen'){svg.classList.add('grab');$('steppers').style.display='flex';newListen();return;}
    svg.classList.remove('grab');$('steppers').style.display='none';
    streak=0;timedScore=0;
    if(m==='timed'){timeLeft=30;running=true;startTimer();}
    newQuiz();
  }
  $('levels').addEventListener('click',function(e){var b=e.target.closest('.lvl');if(b)enterMode(b.dataset.mode);});

  if(canSpeak){
    $('spkBtn').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊';
      if(muted){try{speechSynthesis.cancel();}catch(e){}}};
  }else{$('spkBtn').style.display='none';}

  function startTimer(){
    clearTimer();
    timer=setInterval(function(){timeLeft--;setStat('⏱ '+timeLeft+'s');
      if(timeLeft<=0){clearTimer();running=false;endTimed();}},1000);
    setStat('⏱ '+timeLeft+'s');
  }
  function endTimed(){
    lcd('<span class="huge">時間到!</span><br><span class="small">答對 '+timedScore+' 題 🎉</span>');
    if(timedScore>=6)celebrate();
    var row=$('btnrow');row.innerHTML='';mkKey(row,'g','▶','再玩一次',function(){enterMode('timed');});
  }

  function randMinute(){
    if(diff==='hour')return 0;
    if(diff==='half')return Math.random()<.5?0:30;
    if(diff==='quarter')return [0,15,30,45][Math.floor(Math.random()*4)];
    if(diff==='five')return Math.floor(Math.random()*12)*5;
    return Math.floor(Math.random()*60);
  }
  function quizPrompt(){
    if(mode==='quiz'){setStat(streak>0?'⭐x'+streak:'');lcd('<span class="huge">幾點呢?</span><br><span class="small">選對就得 ⭐</span>');}
    else if(mode==='streak'){setStat('連 '+streak+'/5');lcd('<span class="huge">幾點呢?</span><br><span class="small">連對 5 題拿獎章 🏅</span>');}
    else if(mode==='timed'){setStat('⏱ '+timeLeft+'s');lcd('<span class="huge">幾點呢?</span><br><span class="small">已答對 '+timedScore+' 題</span>');}
  }
  function newQuiz(){
    solved=false;
    hours=Math.floor(Math.random()*12);minutes=randMinute();
    correct={h:hours,m:minutes};options=[{h:hours,m:minutes}];
    var g=0;while(options.length<3&&g++<60){var c={h:Math.floor(Math.random()*12),m:randMinute()};
      if(!options.some(function(o){return o.h===c.h&&o.m===c.m;}))options.push(c);}
    for(var i=options.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=options[i];options[i]=options[j];options[j]=t;}
    renderClock();quizPrompt();answerButtons();
  }
  function answer(o){
    if(solved && mode!=='timed')return;
    var ok=(o.h===correct.h && o.m===correct.m);
    if(!ok){
      if(mode==='streak' && streak>0){streak=0;setStat('連 0/5');
        lcd('<span class="huge">哎呀!</span><br><span class="small">連對中斷，重新開始</span>');}
      else lcd('<span class="huge">再試試看!</span><br><span class="small">看看短針過了哪個數字</span>');
      toy.classList.remove('shake');void toy.offsetWidth;toy.classList.add('shake');return;
    }
    if(mode==='timed'){if(!running)return;timedScore++;celebrateSmall();newQuiz();setStat('⏱ '+timeLeft+'s');return;}
    solved=true;streak++;celebrate();
    if(mode==='streak'){
      setStat('連 '+Math.min(streak,5)+'/5');
      if(streak>=5){medal=true;markMedal();
        lcd('<span class="huge">🏅 解鎖獎章!</span><br><span class="small">連對 5 題，太厲害了！</span>');
        var row=$('btnrow');row.innerHTML='';mkKey(row,'g','▶','再挑戰一次',function(){streak=0;newQuiz();});return;}
      lcd('<span class="huge">👍 GOOD JOB!</span><br><span class="small">連對 '+streak+' 題，再接再厲！</span>');
    }else{
      setStat('⭐x'+streak);
      lcd('<span class="huge">👍 GOOD JOB!</span><br><span class="small">'+fmt(correct.h,correct.m)+' 答對了！</span>');
    }
    var row2=$('btnrow');row2.innerHTML='';mkKey(row2,'g','▶','下一題',newQuiz);
  }
  function markMedal(){
    var b=$('levels').querySelector('[data-mode="streak"]');
    if(b && !b.querySelector('.badge')){var s=document.createElement('span');s.className='badge';s.textContent='🏅';b.appendChild(s);}
  }

  function listenLCD(){lcd('<span class="big">👂 幾點呢?</span><br><span class="small">你設的：'+fmt(hours,minutes)+'　按 ✓ 對答案</span>');}
  function listenButtons(){var row=$('btnrow');row.innerHTML='';
    if(canSpeak)mkKey(row,'y','🔊','再聽一次',speakTarget);
    mkKey(row,'g','✓','對答案',checkListen);}
  function newListen(){solved=false;
    target={h:Math.floor(Math.random()*12),m:randMinute()};
    hours=0;minutes=0;renderClock();setStat('👂');listenLCD();listenButtons();
    setTimeout(speakTarget,300);}
  function checkListen(){
    if(hours%12===target.h && minutes===target.m){
      solved=true;celebrate();
      lcd('<span class="huge">👍 GOOD JOB!</span><br><span class="small">'+fmt(target.h,target.m)+' 完全正確！</span>');
      var row=$('btnrow');row.innerHTML='';mkKey(row,'g','▶','下一題',newListen);
    }else{
      toy.classList.remove('shake');void toy.offsetWidth;toy.classList.add('shake');
      lcd('<span class="huge">還沒對喔!</span><br><span class="small">再聽一次，慢慢調整指針</span>');
      setTimeout(speakTarget,700);
    }
  }

  function celebrate(){
    toy.classList.remove('celebrate');void toy.offsetWidth;toy.classList.add('celebrate');
    var em=['⭐','🎉','✨','🌟','💖'];
    for(var k=0;k<10;k++){var s=document.createElement('span');s.className='burst';s.textContent=em[k%em.length];
      s.style.left=(42+Math.random()*16)+'%';s.style.top='36%';
      s.style.setProperty('--dx',(Math.random()*200-100)+'px');s.style.setProperty('--dy',(-70-Math.random()*110)+'px');
      toy.appendChild(s);(function(el){setTimeout(function(){el.remove();},1000);})(s);}
  }
  function celebrateSmall(){var s=document.createElement('span');s.className='burst';s.textContent='⭐';
    s.style.left='50%';s.style.top='36%';s.style.setProperty('--dx',(Math.random()*80-40)+'px');s.style.setProperty('--dy','-80px');
    toy.appendChild(s);setTimeout(function(){s.remove();},700);}

  function randomFree(){hours=Math.floor(Math.random()*12);minutes=randMinute();update();}

  $('topbar').addEventListener('click',function(e){var b=e.target.closest('.tag[data-diff]');if(!b)return;
    diff=b.dataset.diff;[].forEach.call(this.querySelectorAll('.tag[data-diff]'),function(c){c.classList.toggle('on',c===b);});
    if(mode==='free')update();
    else if(mode==='listen')newListen();
    else if(mode!=='timed' || running)newQuiz();});
  $('hPlus').onclick=function(){hours=(hours+1)%12;update();};
  $('hMinus').onclick=function(){hours=(hours+11)%12;update();};
  $('mPlus').onclick=function(){minutes=(minutes+1)%60;update();};
  $('mMinus').onclick=function(){minutes=(minutes+59)%60;update();};

  function pAng(e){var r=svg.getBoundingClientRect(),s=100/r.width;
    var dx=(e.clientX-r.left)*s-cx,dy=(e.clientY-r.top)*s-cy;var a=Math.atan2(dx,-dy)*180/Math.PI;return a<0?a+360:a;}
  function aDist(a,b){var d=Math.abs(a-b)%360;return d>180?360-d:d;}
  var drag=null;
  svg.addEventListener('pointerdown',function(e){if(mode!=='free'&&mode!=='listen')return;
    var a=pAng(e),hA=(hours%12+minutes/60)*30,mA=minutes*6;drag=(aDist(a,hA)<=aDist(a,mA))?'h':'m';mv(e);});
  function mv(e){if(!drag)return;e.preventDefault();var a=pAng(e);
    if(drag==='m'){minutes=Math.round(a/6)%60;}
    else{var raw=a/30,h=Math.floor(raw),m=Math.round((raw-h)*60);if(m===60){m=0;h++;}hours=h%12;minutes=m;}update();}
  window.addEventListener('pointermove',mv,{passive:false});
  window.addEventListener('pointerup',function(){drag=null;});

  enterMode('free');
})();
</script>
</body>
</html>
